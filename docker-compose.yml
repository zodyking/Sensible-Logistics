# Container Tracker — Dokploy-ready Compose stack.
#
# The stack ships its own PostGIS database. The schema uses `geometry` columns,
# so a plain PostgreSQL server (including Dokploy's default Postgres template)
# cannot host it — the migrator aborts on purpose rather than half-applying.
#
# Dokploy usage:
#   1. Point the project at this compose file and set env vars in the UI.
#   2. Leave DATABASE_URL unset to use the bundled `postgres` service. Set it
#      only when the target server already has the postgis extension.
#   3. Do not publish host ports — Traefik routes via the Domains tab.
#      Set the domain container port to 3847 (the app listen port).
#   4. `postgres` and `seaweedfs` stay on the internal `container-tracker`
#      network — do not publish their ports.
#   5. App health is defined on the image (Dockerfile HEALTHCHECK),
#      not duplicated here.

services:
  postgres:
    # PostGIS build of Postgres 17. The plain `postgres` image cannot create the
    # extension the schema needs.
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: container_tracker
      POSTGRES_DB: container_tracker
      # Reachable only from this compose network; the port is never published.
      # Changing it after the first deploy requires deleting `postgres-data`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-container_tracker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U container_tracker -d container_tracker"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - container-tracker

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024 -volume.max=0 -ip=seaweedfs
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9333/cluster/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - container-tracker

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # The migrator retries the connection on its own, but waiting for the
    # bundled database keeps the first boot free of failed attempts.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Always 3847 inside the container. Do not interpolate PORT from env —
      # a leftover PORT=3000 in Dokploy would collide with the panel if published.
      PORT: "3847"
      HOST: ${HOST:-0.0.0.0}
      NUXT_PUBLIC_APP_NAME: ${NUXT_PUBLIC_APP_NAME:-Sensible Logistics Solutions LLC}
      # Public origin used to build email verification links.
      NUXT_APP_URL: ${NUXT_APP_URL:?set NUXT_APP_URL}
      # Outbound SMTP — required for driver email verification.
      NUXT_SMTP_HOST: ${NUXT_SMTP_HOST:?set NUXT_SMTP_HOST}
      NUXT_SMTP_PORT: ${NUXT_SMTP_PORT:-587}
      NUXT_SMTP_SECURE: ${NUXT_SMTP_SECURE:-false}
      # SMTP login only — not the From email.
      NUXT_SMTP_USER: ${NUXT_SMTP_USER:-}
      NUXT_SMTP_PASSWORD: ${NUXT_SMTP_PASSWORD:-}
      # From email shown to recipients. Distinct from NUXT_SMTP_USER.
      NUXT_SMTP_FROM_EMAIL: ${NUXT_SMTP_FROM_EMAIL:?set NUXT_SMTP_FROM_EMAIL}
      NUXT_SMTP_FROM_NAME: ${NUXT_SMTP_FROM_NAME:-}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD}
      # Company identity — the invite code gates driver signup, so it is
      # operator-owned. Rotate by changing this value and redeploying.
      NUXT_COMPANY_INVITE_CODE: ${NUXT_COMPANY_INVITE_CODE:?set NUXT_COMPANY_INVITE_CODE}
      NUXT_COMPANY_NAME: ${NUXT_COMPANY_NAME:-Sensible Logistics Solutions LLC}
      NUXT_COMPANY_LEGAL_NAME: ${NUXT_COMPANY_LEGAL_NAME:-}
      NUXT_COMPANY_USDOT_NUMBER: ${NUXT_COMPANY_USDOT_NUMBER:-}
      NUXT_COMPANY_TIMEZONE: ${NUXT_COMPANY_TIMEZONE:-America/New_York}
      NUXT_COMPANY_CYCLE_TYPE: ${NUXT_COMPANY_CYCLE_TYPE:-SEVENTY_EIGHT}
      # Defaults to the bundled `postgres` service above. Override only with a
      # connection string whose database already has the postgis extension.
      DATABASE_URL: ${DATABASE_URL:-postgresql://container_tracker:${POSTGRES_PASSWORD:-container_tracker}@postgres:5432/container_tracker}
      NUXT_DATABASE_SSL: ${NUXT_DATABASE_SSL:-false}
      NUXT_S3_ENDPOINT: ${NUXT_S3_ENDPOINT:-http://seaweedfs:8333}
      NUXT_S3_REGION: ${NUXT_S3_REGION:-us-east-1}
      NUXT_S3_BUCKET: ${NUXT_S3_BUCKET:-container-tracker}
      NUXT_S3_ACCESS_KEY_ID: ${NUXT_S3_ACCESS_KEY_ID:-}
      NUXT_S3_SECRET_ACCESS_KEY: ${NUXT_S3_SECRET_ACCESS_KEY:-}
      NUXT_OCR_SERVICE_URL: ${NUXT_OCR_SERVICE_URL:-}
      NUXT_PUBLIC_MAP_TILES_URL: ${NUXT_PUBLIC_MAP_TILES_URL:-}
      NUXT_PUBLIC_GEOCODER_URL: ${NUXT_PUBLIC_GEOCODER_URL:-}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
    # No host ports. Dokploy's panel already owns 3000; Traefik reaches this
    # container on PORT (3847) through the compose network.
    networks:
      - container-tracker

volumes:
  postgres-data:
  seaweed-data:

networks:
  container-tracker:
    driver: bridge
